version: '3.9'

# CONTROL OS — PostgreSQL local para desenvolvimento.
# Fase 1: sobe o banco e aplica init.sql, mas apps/api ainda não o consulta
# em runtime (ver apps/api/README.md).
services:
  postgres:
    image: postgres:16-alpine
    container_name: control-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: control_os
      POSTGRES_PASSWORD: control_os_dev
      POSTGRES_DB: control_os
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U control_os']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
