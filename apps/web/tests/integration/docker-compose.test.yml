name: control-os-sprint-4-2-tests

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: control_os_test
      POSTGRES_PASSWORD: control_os_test
      POSTGRES_DB: control_os_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_os_test -d control_os_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
