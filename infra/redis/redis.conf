# CONTROL OS — Redis (app) — configuração
#
# Redis dedicado ao CONTROL OS (apps/web e futuros consumidores de
# cache/sessão/rate-limit). Separado do Redis da Evolution API de
# propósito — ver docker-compose.yml e README, seção "Evolution API
# separada": cada serviço tem seu próprio Redis, sem compartilhar
# instância nem namespace de chaves.
#
# Nota de escopo: nenhum código em apps/web usa Redis ainda hoje (nenhuma
# dependência "redis"/"ioredis" no package.json) — este container só
# provisiona a infraestrutura antecipadamente, como pedido. Os comentários
# em services/memory/*.ts já preveem Redis como implementação futura de
# "short-term memory" da NOVA; quando isso for implementado, é este
# container que será usado.

# --- Rede ------------------------------------------------------------------
bind 0.0.0.0
protected-mode yes
port 6379

# --- Autenticação ------------------------------------------------------------
# Substituído em runtime: o container recebe REDIS_PASSWORD via variável de
# ambiente e o entrypoint do docker-compose.yml passa
# "--requirepass ${REDIS_PASSWORD}" na linha de comando, que tem
# precedência sobre este arquivo. Mantido aqui comentado só como
# documentação do que está em vigor.
# requirepass CHANGE_ME_VIA_ENV

# --- Persistência ------------------------------------------------------------
# AOF (Append Only File) — mais durável que só RDB para dados de
# cache/sessão que não queremos perder num restart do container.
appendonly yes
appendfsync everysec

# Snapshots RDB como segunda camada (padrão do Redis, mantido).
save 900 1
save 300 10
save 60 10000

# --- Memória -------------------------------------------------------------
# Cache não deve crescer sem limite — descarta as chaves menos usadas
# recentemente quando o limite é atingido, mesmo comportamento esperado de
# um cache (nunca de um banco de dados primário, que este Redis não é).
maxmemory 256mb
maxmemory-policy allkeys-lru

# --- Logging -----------------------------------------------------------------
loglevel notice
