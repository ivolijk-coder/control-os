<!doctype html>
<html lang="pt-BR" data-persona="nova">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Concept 04 — Light Monolith — CONTROL OS Design Lab</title>
<style>
  :root { --bg: #030304; }
  html[data-persona="nova"] { --accent: #38bdf8; --accent-bright: #e0f2fe; --accent-dim: #0c2a3d; }
  html[data-persona="legendary"] { --accent: #d9a455; --accent-bright: #f6e4c2; --accent-dim: #2e2210; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: -apple-system, system-ui, "Segoe UI", sans-serif; }
  .topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; z-index: 10; }
  .back { color: #555; text-decoration: none; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .back:hover { color: #999; }
  .toggle { display: flex; gap: 4px; background: #0a0a0c; border: 1px solid #1c1c20; border-radius: 999px; padding: 3px; }
  .toggle button { border: none; background: transparent; color: #666; font-size: 10px; letter-spacing: .06em; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-weight: 700; }
  .toggle button.active { background: var(--accent); color: #04050a; }
  .label { position: fixed; bottom: 22px; left: 22px; color: #444; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .stage { position: relative; width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 16vh; }
  .monolith { position: relative; width: 14px; height: 44vh; background: linear-gradient(180deg, #0c0c10, #1a1a20 45%, #0c0c10); overflow: hidden; box-shadow: 0 30px 60px rgba(0, 0, 0, .6); }
  .sheen { position: absolute; left: 0; right: 0; top: -50%; height: 45%; background: linear-gradient(180deg, transparent, var(--accent-bright), transparent); opacity: .55; animation: sweep 6.5s ease-in-out infinite; }
  .edge { position: absolute; top: 0; bottom: 0; width: 1px; background: linear-gradient(180deg, transparent, var(--accent), transparent); opacity: .5; }
  .edge-l { left: 0; }
  .edge-r { right: 0; }
  .reflection { position: absolute; bottom: -34px; left: 0; width: 14px; height: 28px; background: linear-gradient(180deg, rgba(255, 255, 255, .06), transparent); filter: blur(3px); }
  @keyframes sweep { 0% { top: -50%; } 100% { top: 105%; } }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../index.html">&larr; Galeria</a>
    <div class="toggle">
      <button data-persona="nova">NOVA</button>
      <button data-persona="legendary">LEGENDARY</button>
    </div>
  </div>
  <div class="stage">
    <div class="monolith">
      <div class="edge edge-l"></div>
      <div class="edge edge-r"></div>
      <div class="sheen"></div>
      <div class="reflection"></div>
    </div>
  </div>
  <div class="label">Concept 04 — Light Monolith</div>
  <script>
    const root = document.documentElement;
    const KEY = 'control-os-design-lab-persona';
    function applyPersona(p) {
      root.setAttribute('data-persona', p);
      document.querySelectorAll('.toggle button').forEach((b) => b.classList.toggle('active', b.dataset.persona === p));
    }
    applyPersona(localStorage.getItem(KEY) || 'nova');
    document.querySelectorAll('.toggle button').forEach((b) => {
      b.addEventListener('click', () => {
        localStorage.setItem(KEY, b.dataset.persona);
        applyPersona(b.dataset.persona);
      });
    });
  </script>
</body>
</html>
