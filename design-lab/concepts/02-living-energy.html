<!doctype html>
<html lang="pt-BR" data-persona="nova">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Concept 02 — Living Energy — CONTROL OS Design Lab</title>
<style>
  :root { --bg: #030304; }
  html[data-persona="nova"] { --accent: #38bdf8; --accent-bright: #e0f2fe; --accent-dim: #0c2a3d; }
  html[data-persona="legendary"] { --accent: #d9a455; --accent-bright: #f6e4c2; --accent-dim: #2e2210; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: -apple-system, system-ui, "Segoe UI", sans-serif; }
  .topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; z-index: 10; }
  .back { color: #555; text-decoration: none; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .back:hover { color: #999; }
  .toggle { display: flex; gap: 4px; background: #0a0a0c; border: 1px solid #1c1c20; border-radius: 999px; padding: 3px; }
  .toggle button { border: none; background: transparent; color: #666; font-size: 10px; letter-spacing: .06em; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-weight: 700; }
  .toggle button.active { background: var(--accent); color: #04050a; }
  .label { position: fixed; bottom: 22px; left: 22px; color: #444; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .core-wrap { position: relative; width: 260px; height: 260px; }
  .blob { position: absolute; inset: 0; border-radius: 50%; filter: blur(28px); mix-blend-mode: screen; }
  .blob-1 { background: radial-gradient(circle at 42% 40%, var(--accent-bright), var(--accent) 42%, transparent 70%); animation: drift1 7s ease-in-out infinite; }
  .blob-2 { background: radial-gradient(circle at 58% 56%, var(--accent), transparent 62%); opacity: .65; animation: drift2 9s ease-in-out infinite; }
  .blob-3 { background: radial-gradient(circle at 50% 50%, var(--accent-dim), transparent 68%); opacity: .55; animation: drift3 11s ease-in-out infinite; }
  .core-dot { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: var(--accent-bright); box-shadow: 0 0 18px var(--accent); }
  @keyframes drift1 { 0%, 100% { transform: scale(1) translate(0, 0); } 50% { transform: scale(1.12) translate(6px, -8px); } }
  @keyframes drift2 { 0%, 100% { transform: scale(1) translate(0, 0); } 50% { transform: scale(.9) translate(-10px, 6px); } }
  @keyframes drift3 { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../index.html">&larr; Galeria</a>
    <div class="toggle">
      <button data-persona="nova">NOVA</button>
      <button data-persona="legendary">LEGENDARY</button>
    </div>
  </div>
  <div class="stage">
    <div class="core-wrap">
      <div class="blob blob-3"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-1"></div>
      <div class="core-dot"></div>
    </div>
  </div>
  <div class="label">Concept 02 — Living Energy</div>
  <script>
    const root = document.documentElement;
    const KEY = 'control-os-design-lab-persona';
    function applyPersona(p) {
      root.setAttribute('data-persona', p);
      document.querySelectorAll('.toggle button').forEach((b) => b.classList.toggle('active', b.dataset.persona === p));
    }
    applyPersona(localStorage.getItem(KEY) || 'nova');
    document.querySelectorAll('.toggle button').forEach((b) => {
      b.addEventListener('click', () => {
        localStorage.setItem(KEY, b.dataset.persona);
        applyPersona(b.dataset.persona);
      });
    });
  </script>
</body>
</html>
